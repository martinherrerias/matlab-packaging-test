name = "PkgBuild"

# Development environment (folders added to the path when project is loaded)
[folders]
path = [
    ".",
]
test = [
    "tests",
]

[dependencies]
matlab_toml = {version = ">=1.3", id = "b07fcaf1-c632-4418-b3ff-199244221efc"}

[project]
summary = "Build MATLAB toolboxes from matlab.toml on R2026a and earlier"
startup-files = [
    "scripts/startup.m",
]
shutdown-files = [
]

[project.labels.test]

[[package]]
configuration-name = "Release"

name = "PkgBuild"
display-name = "PkgBuild"
version = "1.0.0"

# Should match UUID assigned by File Exchange
id = "794f3978-8e02-4c93-9f6a-d5f4236db196"

# Execution environment (folders added to end-user path)
package-root = "/"
folders.path = ["."]

use-license-bsd = false
provider.name = "Martin"
provider.email = "martin.herreriasazcue@manchester.ac.uk"
provider.organization = "University of Manchester"
summary = "Build MATLAB toolboxes from matlab.toml on R2026a and earlier"
description = "PkgBuild provides PkgBuild.fromTOML, a compatibility shim that packages a .mltbx toolbox from a matlab.toml file on MATLAB R2026a and earlier, where native TOML support is not yet available."

getting-started-file = "doc/GettingStarted.m"
preview-image-file = "resources/package-icon.png"

# R2025a is the first release to support toolbox.ignore
release-compatibility = "25.1.* - 26.2.*"
supported-platforms = [
    "windows",
    "linux",
    "macos",
]
